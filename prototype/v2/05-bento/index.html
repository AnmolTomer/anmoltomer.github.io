<script>
(function () {
  var d = document.documentElement, t;
  d.classList.add('js');
  try { t = localStorage.getItem('theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  d.dataset.theme = t;
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('rm');
  setTimeout(function () { if (!window.__motion) d.classList.add('reveal-all'); }, 3500);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lenis@1.1.13/dist/lenis.css">
<style>
:root {
  --ease-out: cubic-bezier(.23,1,.32,1);
  --ease-in-out: cubic-bezier(.77,0,.175,1);
  --ease-spring: cubic-bezier(.34,1.4,.64,1);
  --bg: #f1f1f3;
  --bg-dot: rgb(0 0 0 / .045);
  --tile: #ffffff;
  --tile-2: #f6f6f8;
  --ink: #0c0c0f;
  --ink-2: #4f4f58;
  --ink-3: #8a8a94;
  --line: rgb(12 12 20 / .07);
  --line-2: rgb(12 12 20 / .12);
  --accent: #5b5bd6;
  --accent-ink: #ffffff;
  --ok: #18a058;
  --fail: #e5484d;
  --spot: rgb(91 91 214 / .085);
  --glow: rgb(91 91 214 / .55);
  --shadow: 0 1px 2px rgb(16 16 24 / .04), 0 10px 30px -14px rgb(16 16 24 / .14);
  --shadow-lift: 0 2px 4px rgb(16 16 24 / .05), 0 24px 60px -20px rgb(16 16 24 / .28);
  --btn: #0c0c0f;
  --btn-ink: #ffffff;
  --r: 24px;
  --max: 1240px;
  --gut: 24px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08080a; --bg-dot: rgb(255 255 255 / .05); --tile: #121215; --tile-2: #1a1a1f;
    --ink: #f3f3f6; --ink-2: #a6a6b0; --ink-3: #6c6c76; --line: rgb(255 255 255 / .07); --line-2: rgb(255 255 255 / .13);
    --accent: #8e8cff; --accent-ink: #0b0b10; --spot: rgb(142 140 255 / .09); --glow: rgb(170 168 255 / .6);
    --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
    --shadow-lift: 0 1px 0 rgb(255 255 255 / .04) inset, 0 30px 70px -20px rgb(0 0 0 / .85);
    --btn: #f3f3f6; --btn-ink: #0c0c0f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08080a; --bg-dot: rgb(255 255 255 / .05); --tile: #121215; --tile-2: #1a1a1f;
  --ink: #f3f3f6; --ink-2: #a6a6b0; --ink-3: #6c6c76; --line: rgb(255 255 255 / .07); --line-2: rgb(255 255 255 / .13);
  --accent: #8e8cff; --accent-ink: #0b0b10; --spot: rgb(142 140 255 / .09); --glow: rgb(170 168 255 / .6);
  --shadow: 0 1px 0 rgb(255 255 255 / .03) inset, 0 10px 30px -14px rgb(0 0 0 / .7);
  --shadow-lift: 0 1px 0 rgb(255 255 255 / .04) inset, 0 30px 70px -20px rgb(0 0 0 / .85);
  --btn: #f3f3f6; --btn-ink: #0c0c0f; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background-image: radial-gradient(var(--bg-dot) 1px, transparent 1px);
  background-size: 22px 22px; background-position: -11px -11px;
  overflow-x: clip;
}
img { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.mono { font-family: "Geist Mono", ui-monospace, monospace; }
.eyebrow { font: 500 11px/1 "Geist Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: 8px; }
.wrap { max-width: calc(var(--max) + var(--gut) * 2); margin: 0 auto; padding: 0 var(--gut); }

/* ---------- header ---------- */
.hdr { position: fixed; inset: 0 0 auto; z-index: 50; padding-top: env(safe-area-inset-top); transition: background-color .3s var(--ease-out), box-shadow .3s var(--ease-out), backdrop-filter .3s; }
.hdr.scrolled { background: color-mix(in oklab, var(--bg) 78%, transparent); backdrop-filter: blur(14px) saturate(1.4); -webkit-backdrop-filter: blur(14px) saturate(1.4); box-shadow: 0 1px 0 var(--line); }
.hdr .wrap { height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; min-height: 44px; }
.brand img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; object-position: 50% 18%; box-shadow: 0 0 0 1px var(--line-2); }
.nav { position: relative; display: flex; padding: 4px; border-radius: 999px; background: color-mix(in oklab, var(--tile) 70%, transparent); box-shadow: 0 0 0 1px var(--line); }
.nav a { position: relative; z-index: 1; padding: 0 14px; height: 36px; display: inline-flex; align-items: center; font-size: 13.5px; font-weight: 500; color: var(--ink-2); border-radius: 999px; transition: color .2s var(--ease-out); }
.nav a[aria-current="true"], .nav a.hover { color: var(--ink); }
.nav .ind { position: absolute; inset: 4px; border-radius: 999px; background: var(--tile); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line); clip-path: inset(0 100% 0 0 round 999px); transition: clip-path .32s var(--ease-out); pointer-events: none; }
.hdr-r { display: flex; align-items: center; gap: 8px; }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; color: var(--ink-2); transition: background-color .2s var(--ease-out), color .2s var(--ease-out), transform .16s var(--ease-out); }
.icon-btn:active { transform: scale(.94); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font-weight: 500; font-size: 14px; white-space: nowrap; transition: transform .16s var(--ease-out), background-color .2s var(--ease-out), box-shadow .2s var(--ease-out); }
.btn:active { transform: scale(.97); }
.btn-p { background: var(--btn); color: var(--btn-ink); box-shadow: 0 1px 2px rgb(0 0 0 / .2), inset 0 1px 0 rgb(255 255 255 / .12); }
.btn-s { background: var(--tile); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2); }
.btn svg { width: 16px; height: 16px; transition: transform .25s var(--ease-out); }
.btn-sm { min-height: 38px; padding: 0 14px; font-size: 13px; }
@media (hover: hover) and (pointer: fine) {
  .icon-btn:hover { background: var(--tile); color: var(--ink); }
  .btn-p:hover svg, .btn-s:hover svg { transform: translateX(3px); }
  .btn-s:hover { box-shadow: 0 0 0 1px var(--ink-3); }
}

/* ---------- theme morph icon ---------- */
.sm { width: 22px; height: 22px; overflow: visible; }
.sm .core { transform-box: fill-box; transform-origin: center; transition: transform .55s var(--ease-spring); }
.sm .bite { transform-box: fill-box; transform-origin: center; transition: transform .55s var(--ease-out); transform: translate(9px, -9px); }
.sm .rays { transform-box: fill-box; transform-origin: center; transition: transform .55s var(--ease-spring), opacity .3s var(--ease-out); }
[data-theme="dark"] .sm .core { transform: scale(1.7); }
[data-theme="dark"] .sm .bite { transform: translate(0, 0); }
[data-theme="dark"] .sm .rays { transform: rotate(90deg) scale(.5); opacity: 0; }

/* ---------- tiles ---------- */
.tile { position: relative; isolation: isolate; background: var(--tile); border-radius: var(--r); box-shadow: var(--shadow), 0 0 0 1px var(--line); overflow: hidden; --mx: 50%; --my: 50%; }
.tile::before { content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(380px circle at var(--mx) var(--my), var(--spot), transparent 65%); opacity: 0; transition: opacity .35s var(--ease-out); }
.tile::after { content: ""; position: absolute; inset: 0; z-index: 4; pointer-events: none; border-radius: inherit; padding: 1px;
  background: radial-gradient(240px circle at var(--mx) var(--my), var(--glow), transparent 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  opacity: 0; transition: opacity .35s var(--ease-out); }
.tile > * { position: relative; z-index: 1; }
@media (hover: hover) and (pointer: fine) {
  .tile.lit::before, .tile.lit::after { opacity: 1; }
}
.tile[data-open] { cursor: pointer; }
.xp { position: absolute; top: 8px; right: 8px; z-index: 5; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; }
.xp span { width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; background: var(--tile-2); color: var(--ink-2); box-shadow: 0 0 0 1px var(--line); transition: transform .25s var(--ease-out), opacity .25s var(--ease-out), background-color .2s; }
.xp svg { width: 14px; height: 14px; }
.xp:active span { transform: scale(.9); }
@media (hover: hover) and (pointer: fine) {
  .xp span { opacity: 0; transform: scale(.85); }
  .tile:hover .xp span, .xp:focus-visible span { opacity: 1; transform: scale(1); }
  .xp:hover span { background: var(--btn); color: var(--btn-ink); }
}

/* ---------- bento ---------- */
.hero { padding-top: 84px; }
.bento { display: grid; gap: 12px; grid-template-columns: repeat(12, minmax(0, 1fr)); grid-template-rows: repeat(6, minmax(0, 1fr)); height: clamp(640px, calc(100svh - 112px), 820px); }
.t-intro { grid-column: 1 / 6; grid-row: 1 / 5; }
.t-portrait { grid-column: 6 / 9; grid-row: 1 / 5; }
.t-stats { grid-column: 9 / 13; grid-row: 1 / 3; }
.t-now { grid-column: 9 / 13; grid-row: 3 / 5; }
.t-stack { grid-column: 1 / 6; grid-row: 5 / 7; }
.t-article { grid-column: 6 / 10; grid-row: 5 / 7; }
.t-social { grid-column: 10 / 13; grid-row: 5 / 6; }
.t-theme { grid-column: 10 / 13; grid-row: 6 / 7; }

.js:not(.rm):not(.reveal-all) [data-enter] { opacity: 0; }

/* intro */
.t-intro { padding: 28px 30px 28px; display: flex; flex-direction: column; justify-content: space-between; gap: 18px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 12px 0 10px; border-radius: 999px; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); font: 500 12px/1 "Geist Mono", monospace; color: var(--ink-2); width: fit-content; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 60%, transparent); }
:not(.rm) .dot.pulse { animation: pulse 2.2s var(--ease-out) infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in oklab, var(--ok) 55%, transparent); } 100% { box-shadow: 0 0 0 9px transparent; } }
.name { font-size: clamp(56px, 6.4vw, 92px); line-height: .9; letter-spacing: -.045em; font-weight: 600; }
.name .l2 { display: block; font-family: "Instrument Serif", serif; font-style: italic; font-weight: 400; letter-spacing: -.02em; color: var(--ink-2); padding-left: .04em; }
.headline { margin-top: 18px; font-size: clamp(18px, 1.6vw, 22px); line-height: 1.3; letter-spacing: -.015em; font-weight: 500; max-width: 26ch; text-wrap: balance; }
.intro { margin-top: 10px; color: var(--ink-2); max-width: 46ch; font-size: 14.5px; text-wrap: pretty; }
.ctas { display: flex; gap: 10px; flex-wrap: wrap; }

/* portrait */
.t-portrait { background: #cfe0c4; }
.t-portrait .ph { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
.t-portrait .ph img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; transform: scale(1.08); }
html:not(.rm) .t-portrait .ph img { animation: kb 24s var(--ease-in-out) infinite alternate; }
@keyframes kb { from { transform: scale(1.06) translate3d(0, 0, 0); } to { transform: scale(1.2) translate3d(-3%, -4%, 0); } }
.cap { position: absolute; z-index: 2; left: 10px; right: 10px; bottom: 10px; padding: 12px 14px; border-radius: 16px; color: #fff; background: rgb(12 14 12 / .42); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .14); font-size: 12.5px; line-height: 1.4; transition: transform .35s var(--ease-out), opacity .3s var(--ease-out); }
.cap b { display: block; font-weight: 600; font-size: 13.5px; margin-bottom: 2px; }
@media (hover: hover) and (pointer: fine) {
  .cap { transform: translateY(calc(100% + 14px)); opacity: 0; }
  .t-portrait:hover .cap, .t-portrait:focus-within .cap { transform: none; opacity: 1; }
}
.t-portrait .xp span { background: rgb(255 255 255 / .75); color: #111; }

/* stats */
.t-stats { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
.stats { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; align-content: end; }
.stat { display: flex; flex-direction: column; gap: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.stat .lbl { font-size: 12.5px; color: var(--ink-3); line-height: 1.25; }
.odo { display: inline-flex; font-size: clamp(30px, 2.6vw, 40px); font-weight: 600; letter-spacing: -.04em; line-height: 1; height: 1em; overflow: hidden; font-variant-numeric: tabular-nums; }
.odo-d { display: block; height: 1em; overflow: hidden; }
.odo-s { display: flex; flex-direction: column; transition: transform 1.6s var(--ease-out); will-change: transform; }
.odo-s span { height: 1em; line-height: 1; display: block; }

/* now */
.t-now { padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 10px; }
.now-top { display: flex; align-items: center; justify-content: space-between; padding-right: 36px; }
.now-title { font-size: 15px; font-weight: 500; letter-spacing: -.01em; line-height: 1.35; text-wrap: balance; }
.tick { position: relative; flex: 1; min-height: 76px; }
.tick-item { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 4px; transition: transform .55s var(--ease-out), opacity .45s var(--ease-out), filter .45s var(--ease-out); }
.tick-item.pre { transform: translateY(55%); opacity: 0; filter: blur(4px); }
.tick-item.post { transform: translateY(-55%); opacity: 0; filter: blur(4px); }
.rm .tick-item.pre, .rm .tick-item.post { transform: none; filter: none; }
.tick-step { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.tick-step .n { font: 500 11px/1 "Geist Mono", monospace; color: var(--ink-3); }
.tick-step .tag { font: 500 10.5px/1 "Geist Mono", monospace; padding: 4px 7px; border-radius: 999px; background: color-mix(in oklab, var(--fail) 14%, transparent); color: var(--fail); text-transform: uppercase; letter-spacing: .05em; }
.tick-detail { font-size: 13px; color: var(--ink-2); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.segs { display: grid; grid-template-columns: repeat(var(--n, 6), 1fr); gap: 4px; }
.seg { height: 3px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
.seg i { display: block; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }
.seg.done i { transform: scaleX(1); }
.seg.fail i { background: var(--fail); }
.seg.cur i { animation: fill var(--dur, 2800ms) linear forwards; }
.t-now.paused .seg.cur i { animation-play-state: paused; }
@keyframes fill { to { transform: scaleX(1); } }

/* stack marquee */
.t-stack { padding: 22px 0 18px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.t-stack .hd { padding: 0 24px; display: flex; align-items: baseline; gap: 10px; }
.mq { display: flex; flex-direction: column; gap: 8px; -webkit-mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
.mq-row { overflow: hidden; }
.mq-track { display: flex; gap: 10px; width: max-content; will-change: transform; }
.tool { display: inline-flex; align-items: center; gap: 9px; height: 42px; padding: 0 14px 0 10px; border-radius: 14px; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
.tool img { width: 22px; height: 22px; object-fit: contain; }
.tool img.jpg { border-radius: 6px; }
[data-theme="dark"] .mono-logo { filter: invert(1); }
.rm .mq { -webkit-mask: none; mask: none; padding: 0 24px; }
.rm .mq-track { flex-wrap: wrap; width: auto; }
.rm .mq-track [aria-hidden] { display: none; }

/* article */
.t-article { display: grid; grid-template-columns: 44% 1fr; }
.t-article .cv { position: relative; overflow: hidden; background: var(--tile-2); margin: 8px; border-radius: 17px; }
.t-article .cv img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .t-article:hover .cv img { transform: scale(1.05); } }
.t-article .tx { padding: 20px 20px 18px 10px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; }
.t-article h3 { font-size: 17px; line-height: 1.25; letter-spacing: -.015em; font-weight: 600; text-wrap: balance; padding-right: 30px; }
.meta { font: 500 11.5px/1.4 "Geist Mono", monospace; color: var(--ink-3); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tagc { font: 500 11px/1 "Geist Mono", monospace; padding: 5px 8px; border-radius: 999px; background: var(--tile-2); color: var(--ink-2); box-shadow: 0 0 0 1px var(--line); }
.link-arrow { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 500; min-height: 32px; }
.link-arrow svg { width: 14px; height: 14px; transition: transform .25s var(--ease-out); }
@media (hover: hover) and (pointer: fine) { .link-arrow:hover svg { transform: translate(2px, -2px); } }

/* socials */
.t-social { padding: 16px 20px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; }
.socs { display: flex; gap: 6px; }
.t-social .socs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.t-social .soc { width: auto; }
.soc { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); color: var(--ink-2); transition: transform .2s var(--ease-out), color .2s, background-color .2s; }
.soc svg { width: 18px; height: 18px; }
.soc:active { transform: scale(.94); }
@media (hover: hover) and (pointer: fine) { .soc:hover { color: var(--btn-ink); background: var(--btn); transform: translateY(-2px); } }

/* theme tile */
.t-theme { display: flex; align-items: center; justify-content: space-between; padding: 0 22px 0 20px; text-align: left; width: 100%; transition: transform .16s var(--ease-out); }
.t-theme:active { transform: scale(.98); }
.t-theme .sm { width: 34px; height: 34px; color: var(--ink); }
.t-theme .tl { display: flex; flex-direction: column; gap: 6px; }
.roll { position: relative; height: 20px; overflow: hidden; font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.roll span { display: block; height: 20px; line-height: 20px; transition: transform .45s var(--ease-spring); }
[data-theme="dark"] .roll span { transform: translateY(-20px); }
.orb { position: relative; width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); transition: background-color .4s var(--ease-out); }
[data-theme="dark"] .orb { background: radial-gradient(circle at 35% 30%, #2a2a3a, #141420); }

/* ---------- sections ---------- */
section.sec { padding-top: 120px; }
.sec-hd { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 28px; }
.sec-hd h2 { font-size: clamp(34px, 4.2vw, 56px); line-height: 1; letter-spacing: -.04em; font-weight: 600; margin-top: 12px; }
.sec-hd h2 em { font-family: "Instrument Serif", serif; font-weight: 400; letter-spacing: -.01em; color: var(--ink-2); }
.count { display: flex; align-items: baseline; gap: 10px; color: var(--ink-3); font-size: 13px; }
.count b { font-size: clamp(40px, 5vw, 64px); line-height: .9; letter-spacing: -.05em; color: var(--ink); font-weight: 600; }

/* carousel */
.car-wrap { position: relative; }
.car { display: flex; gap: 16px; overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x mandatory; scrollbar-width: none; padding: 6px max(var(--gut), calc((100vw - var(--max)) / 2)) 24px; scroll-padding-inline: max(var(--gut), calc((100vw - var(--max)) / 2)); cursor: grab; -webkit-user-select: none; user-select: none; }
.car::-webkit-scrollbar { display: none; }
.car.drag { scroll-snap-type: none; cursor: grabbing; }
.car.drag .card { pointer-events: none; }
.card { flex: 0 0 auto; width: 360px; scroll-snap-align: start; display: flex; flex-direction: column; transition: transform .3s var(--ease-out), box-shadow .3s var(--ease-out); }
.card .cv { aspect-ratio: 16 / 9; margin: 8px 8px 0; border-radius: 17px; overflow: hidden; background: var(--tile-2); }
.card .cv img { width: 100%; height: 100%; object-fit: cover; transition: transform .6s var(--ease-out); -webkit-user-drag: none; }
.card .bd { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h3 { font-size: 18px; line-height: 1.25; letter-spacing: -.02em; font-weight: 600; text-wrap: balance; }
.card p { font-size: 13.5px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .ft { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card .num { font: 500 11.5px/1 "Geist Mono", monospace; color: var(--ink-3); }
@media (hover: hover) and (pointer: fine) {
  .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lift), 0 0 0 1px var(--line); }
  .card:hover .cv img { transform: scale(1.04); }
}
.car-ctl { display: flex; align-items: center; gap: 14px; }
.car-ctl .icon-btn { box-shadow: 0 0 0 1px var(--line-2); background: var(--tile); }
.car-ctl .icon-btn:disabled { opacity: .4; cursor: default; }
.bar { height: 2px; background: var(--line-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--ink); transform-origin: left; transform: scaleX(0); }

/* principles */
.prin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.prin .tile { padding: 26px 26px 28px; min-height: 260px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.prin .n { font: 500 13px/1 "Geist Mono", monospace; color: var(--ink-3); display: flex; justify-content: space-between; align-items: center; }
.prin .n .glyph { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); color: var(--ink); }
.prin h3 { font-size: 22px; line-height: 1.2; letter-spacing: -.025em; font-weight: 600; }
.prin p { margin-top: 10px; color: var(--ink-2); font-size: 14.5px; text-wrap: pretty; }

/* contact */
.contact { padding: clamp(32px, 5vw, 64px); display: grid; gap: 32px; }
.contact .big { font-size: clamp(30px, 5.6vw, 76px); line-height: 1; letter-spacing: -.045em; font-weight: 600; word-break: break-word; display: inline-block; background: linear-gradient(currentColor, currentColor) 0 100% / 0 2px no-repeat; transition: background-size .45s var(--ease-out); padding-bottom: 6px; }
@media (hover: hover) and (pointer: fine) { .contact .big:hover { background-size: 100% 2px; } }
.contact .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.contact .row .ctas { align-items: center; }
.copy .ok { display: none; }
.copy.done .ok { display: inline; }
.copy.done .cp { display: none; }
footer { padding: 48px 0 110px; color: var(--ink-3); font-size: 13px; }
footer .wrap { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }

/* back to top ring */
.ttop { position: fixed; right: 20px; bottom: 20px; z-index: 40; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--tile); box-shadow: var(--shadow), 0 0 0 1px var(--line); opacity: 0; transform: translateY(12px) scale(.95); pointer-events: none; transition: opacity .25s var(--ease-out), transform .25s var(--ease-out); }
.ttop.on { opacity: 1; transform: none; pointer-events: auto; }
.ttop:active { transform: scale(.94); }
.ttop svg.ring { position: absolute; inset: 0; transform: rotate(-90deg); }
.ttop .ring circle { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
.ttop .arw { width: 16px; height: 16px; }

/* ---------- sheet ---------- */
.backdrop { position: fixed; inset: 0; z-index: 90; background: rgb(10 10 14 / .32); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); opacity: 0; }
[data-theme="dark"] .backdrop { background: rgb(0 0 0 / .55); }
.sheet { position: fixed; inset: 0; margin: auto; z-index: 100; width: min(880px, calc(100vw - 32px)); height: fit-content; max-height: calc(100svh - 48px); display: flex; }
.sheet[hidden], .backdrop[hidden] { display: none; }
.sheet-bg { position: absolute; inset: 0; border-radius: 28px; background: var(--tile); box-shadow: var(--shadow-lift), 0 0 0 1px var(--line); transform-origin: 0 0; will-change: transform; }
.sheet-body { position: relative; width: 100%; max-height: calc(100svh - 48px); overflow: auto; overscroll-behavior: contain; padding: 36px; will-change: transform, opacity; scrollbar-width: thin; }
.sheet-close { position: sticky; top: 0; float: right; margin: -20px -20px 0 12px; z-index: 3; width: 44px; height: 44px; border-radius: 999px; display: grid; place-items: center; background: var(--tile-2); box-shadow: 0 0 0 1px var(--line); transition: transform .16s var(--ease-out), background-color .2s; }
.sheet-close:active { transform: scale(.92); }
.sheet-close svg { width: 16px; height: 16px; }
@media (hover: hover) and (pointer: fine) { .sheet-close:hover { background: var(--btn); color: var(--btn-ink); } }
.ghost { position: fixed; margin: 0; z-index: 101; pointer-events: none; transform-origin: center; will-change: transform, opacity; }
.sh-h { font-size: clamp(28px, 3.6vw, 44px); line-height: 1.02; letter-spacing: -.04em; font-weight: 600; margin: 10px 0 14px; text-wrap: balance; }
.sh-lead { font-size: 17px; color: var(--ink-2); max-width: 60ch; text-wrap: pretty; }
.sh-grid { display: grid; gap: 28px; grid-template-columns: 1fr 1fr; margin-top: 28px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl-row { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.tl-row .y { font: 500 13px/1.5 "Geist Mono", monospace; color: var(--ink-3); }
.tl-row b { display: block; font-weight: 600; letter-spacing: -.01em; }
.tl-row span { color: var(--ink-2); font-size: 14px; }
.tl-row.fail .y, .tl-row.fail b { color: var(--fail); }
.sh-port { display: grid; grid-template-columns: minmax(0, 340px) 1fr; gap: 32px; align-items: end; }
.sh-port img { border-radius: 20px; width: 100%; height: auto; aspect-ratio: 853 / 1280; object-fit: cover; }
.sh-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
.sh-stats .stat { border: 0; padding: 20px; background: var(--tile-2); border-radius: 18px; box-shadow: 0 0 0 1px var(--line); }
.sh-stats .odo { font-size: clamp(36px, 4.4vw, 56px); }
.grp { padding: 18px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: 200px 1fr; gap: 20px; }
.grp h3 { font-size: 16px; font-weight: 600; }
.grp p { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.grp .tools { display: flex; flex-wrap: wrap; gap: 8px; align-content: start; }
.sh-art img { width: 100%; aspect-ratio: 16 / 8; object-fit: cover; border-radius: 20px; margin-bottom: 24px; background: var(--tile-2); }
.soc-list { list-style: none; margin: 20px 0 0; padding: 0; }
.soc-list a { display: flex; align-items: center; gap: 14px; padding: 14px 4px; border-top: 1px solid var(--line); min-height: 60px; }
.soc-list a .soc { flex: none; }
.soc-list a b { font-weight: 600; }
.soc-list a span { color: var(--ink-3); font: 500 13px/1 "Geist Mono", monospace; margin-left: auto; }
.sheet-anim-in > * { animation: none; }

/* view transition for theme */
::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .bento { height: auto; grid-auto-flow: row dense; grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(150px, auto); }
  .t-intro { grid-column: 1 / 5; grid-row: span 3; }
  .t-portrait { grid-column: 5 / 7; grid-row: span 3; }
  .t-stats { grid-column: 1 / 4; grid-row: span 2; }
  .t-now { grid-column: 4 / 7; grid-row: span 2; }
  .t-stack { grid-column: 1 / 7; grid-row: span 1; }
  .t-article { grid-column: 1 / 5; grid-row: span 2; }
  .t-social { grid-column: 5 / 7; grid-row: span 1; }
  .t-theme { grid-column: 5 / 7; grid-row: span 1; }
  .t-social { justify-content: center; gap: 14px; padding: 18px 20px; }
  .prin { grid-template-columns: 1fr; }
  .prin .tile { min-height: 0; }
}
@media (max-width: 760px) {
  :root { --gut: 16px; --r: 22px; }
  .nav { display: none; }
  .hero { padding-top: 76px; }
  .bento { grid-template-columns: 1fr 1fr; grid-auto-rows: auto; gap: 10px; grid-auto-flow: row dense; }
  .t-intro { grid-column: 1 / -1; grid-row: auto; padding: 22px 20px 20px; gap: 24px; }
  .name { font-size: 60px; }
  .t-portrait { grid-column: 1; grid-row: span 2; min-height: 300px; }
  .t-theme { grid-column: 2; grid-row: auto; min-height: 145px; flex-direction: column; align-items: flex-start; justify-content: space-between; padding: 18px; }
  .t-social { grid-column: 2; grid-row: auto; min-height: 145px; padding: 18px; justify-content: space-between; }
  .t-social .socs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .t-stats { grid-column: 1 / -1; grid-row: auto; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .t-now { grid-column: 1 / -1; grid-row: auto; min-height: 250px; }
  .t-stack { grid-column: 1 / -1; grid-row: auto; }
  .t-article { grid-column: 1 / -1; grid-row: auto; grid-template-columns: 1fr; }
  .t-article .cv { aspect-ratio: 16 / 9; }
  .t-article .tx { padding: 14px 20px 18px; }
  .cap { font-size: 11.5px; padding: 10px 11px; }
  .cap b { font-size: 12.5px; margin: 0; }
  .cap .alt { display: none; }
  .contact .big { font-size: clamp(22px, 7vw, 40px); }
  section.sec { padding-top: 88px; }
  .sec-hd { flex-direction: column; align-items: flex-start; }
  .card { width: min(82vw, 330px); }
  .sheet { width: calc(100vw - 16px); max-height: calc(100svh - 16px); }
  .sheet-body { max-height: calc(100svh - 16px); padding: 26px 20px; }
  .sheet-close { margin: -12px -8px 0 8px; }
  .sh-grid, .sh-port { grid-template-columns: 1fr; }
  .sh-port img { max-width: 260px; }
  .sh-stats { grid-template-columns: 1fr 1fr; }
  .grp { grid-template-columns: 1fr; gap: 12px; }
  .contact .row { flex-direction: column; align-items: flex-start; }
  .ttop { bottom: 72px; right: 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<a class="sr-only" href="#main">Skip to content</a>
<header class="hdr" id="hdr">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav" aria-label="Sections" id="nav">
      <span class="ind" aria-hidden="true"></span>
      <a href="#top" data-sec="top">About</a>
      <a href="#writing" data-sec="writing">Writing</a>
      <a href="#principles" data-sec="principles">How I work</a>
      <a href="#contact" data-sec="contact">Contact</a>
    </nav>
    <div class="hdr-r">
      <button class="icon-btn theme-btn" type="button" aria-label="Toggle theme" data-theme-toggle></button>
      <a class="btn btn-p btn-sm" id="hdr-mail">Email me</a>
    </div>
  </div>
</header>

<main id="main">
  <section class="hero wrap" id="top" aria-label="Introduction">
    <div class="bento" id="bento"></div>
  </section>

  <section class="sec" id="writing" aria-labelledby="writing-h">
    <div class="wrap">
      <div class="sec-hd" data-enter>
        <div>
          <span class="eyebrow">Writing · Medium</span>
          <h2 id="writing-h">Notes from <em>the build</em></h2>
        </div>
        <div class="car-ctl">
          <div class="count" id="art-count"></div>
          <button class="icon-btn" type="button" id="car-prev" aria-label="Previous articles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="icon-btn" type="button" id="car-next" aria-label="Next articles"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
      </div>
    </div>
    <div class="car-wrap" data-enter>
      <div class="car" id="car" role="list" aria-label="Articles"></div>
    </div>
    <div class="wrap"><div class="bar" aria-hidden="true"><i id="car-bar"></i></div></div>
  </section>

  <section class="sec wrap" id="principles" aria-labelledby="prin-h">
    <div class="sec-hd" data-enter>
      <div>
        <span class="eyebrow">Principles</span>
        <h2 id="prin-h">How I <em>work</em></h2>
      </div>
    </div>
    <div class="prin" id="prin"></div>
  </section>

  <section class="sec wrap" id="contact" aria-labelledby="contact-h">
    <div class="tile contact" data-enter id="contact-tile">
      <div>
        <span class="eyebrow"><span class="dot pulse"></span>Contact</span>
        <h2 id="contact-h" class="sr-only">Contact</h2>
      </div>
      <a class="big" id="contact-mail"></a>
      <div class="row">
        <div class="ctas" id="contact-ctas"></div>
        <div class="socs" id="contact-socs"></div>
      </div>
    </div>
  </section>
</main>
<footer><div class="wrap"><span id="foot-l"></span><a href="#top" class="link-arrow">Back to top</a></div></footer>

<button class="ttop" type="button" id="ttop" aria-label="Back to top">
  <svg class="ring" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="22" id="ttop-c"/></svg>
  <svg class="arw" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet-bg" id="sheet-bg"></div>
  <div class="sheet-body" id="sheet-body" data-lenis-prevent>
    <button class="sheet-close" type="button" id="sheet-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div id="sheet-content"></div>
  </div>
</div>

<script src="../data.js"></script>
<script src="../switcher.js"></script>
<script src="https://unpkg.com/lenis@1.1.13/dist/lenis.min.js"></script>
<script>
/* ============ render (no library dependency) ============ */
(function () {
  const P = window.PORTFOLIO;
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const ICON = {
    github: '<path fill="currentColor" d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.57l-.02-2.04c-3.34.72-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.74.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.8 1.3 3.49 1 .11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.14-.3-.54-1.52.1-3.18 0 0 1.01-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.28-1.55 3.29-1.23 3.29-1.23.64 1.66.24 2.88.12 3.18a4.65 4.65 0 0 1 1.23 3.22c0 4.61-2.8 5.63-5.48 5.92.43.37.81 1.1.81 2.22l-.01 3.29c0 .32.21.7.82.58A12 12 0 0 0 12 .3"/>',
    linkedin: '<path fill="currentColor" d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/>',
    x: '<path fill="currentColor" d="M18.9 1.15h3.68l-8.04 9.19L24 22.85h-7.4l-5.8-7.59-6.64 7.59H.47l8.6-9.83L0 1.15h7.6l5.24 6.93zm-1.29 19.5h2.04L6.49 3.24H4.3z"/>',
    medium: '<path fill="currentColor" d="M13.54 12a6.8 6.8 0 0 1-6.77 6.82A6.8 6.8 0 0 1 0 12a6.8 6.8 0 0 1 6.77-6.82A6.8 6.8 0 0 1 13.54 12zm7.42 0c0 3.54-1.51 6.42-3.38 6.42-1.87 0-3.39-2.88-3.39-6.42s1.52-6.42 3.39-6.42 3.38 2.88 3.38 6.42M24 12c0 3.17-.53 5.75-1.19 5.75-.66 0-1.19-2.58-1.19-5.75s.53-5.75 1.19-5.75C23.47 6.25 24 8.83 24 12z"/>',
  };
  const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
  const ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17L17 7M8 7h9v9"/></svg>';
  const RIGHT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  const EXPAND = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M10 20H4v-6M20 4l-6.5 6.5M4 20l6.5-6.5"/></svg>';
  const SUNMOON = '<svg class="sm" viewBox="0 0 24 24" aria-hidden="true"><defs><mask id="MID"><rect x="-4" y="-4" width="32" height="32" fill="#fff"/><circle class="bite" cx="17.5" cy="7" r="6" fill="#000"/></mask></defs><g mask="url(#MID)"><circle class="core" cx="12" cy="12" r="5" fill="currentColor"/></g><g class="rays" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1.5v2M12 20.5v2M1.5 12h2M20.5 12h2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M4.6 19.4L6 18M18 6l1.4-1.4"/></g></svg>';
  let mid = 0; const sunmoon = () => SUNMOON.replace(/MID/g, 'mm' + (++mid));
  const mail = 'mailto:' + P.email;
  const SOCIALS = [['github', 'GitHub'], ['linkedin', 'LinkedIn'], ['x', 'X'], ['medium', 'Medium']].map(([k, label]) => {
    let h = P.links[k].split('/').filter(Boolean).pop(); if (!h.startsWith('@')) h = (k === 'x' ? '@' : '') + h;
    return { k, label, url: P.links[k], handle: h };
  });
  const tools = P.stack.flatMap(g => g.tools);
  const logo = t => `<img src="${P.logoBase + t.logo}" alt="" width="22" height="22" loading="lazy" class="${t.mono ? 'mono-logo' : ''} ${t.logo.endsWith('.jpg') ? 'jpg' : ''}">`;
  const toolChip = (t, hidden) => `<span class="tool"${hidden ? ' aria-hidden="true"' : ''}>${logo(t)}${esc(t.name)}</span>`;
  const odo = n => `<span class="odo" role="img" aria-label="${n}">${[...String(n)].map(ch => `<span class="odo-d" aria-hidden="true"><span class="odo-s" data-n="${ch}">${'01234567890123456789'.split('').map(x => `<span>${x}</span>`).join('')}</span></span>`).join('')}</span>`;
  const articles = [...P.articles].sort((a, b) => b.date.localeCompare(a.date));
  const latest = articles[0];
  const xp = (label) => `<button class="xp" type="button" aria-label="Open ${label}" aria-haspopup="dialog"><span>${EXPAND}</span></button>`;
  const tags = t => `<div class="tags">${t.map(x => `<span class="tagc">${esc(x)}</span>`).join('')}</div>`;

  /* header */
  $('#brand').innerHTML = `<img src="${P.portrait.src}" alt="" width="30" height="30"><span>${esc(P.name)}</span>`;
  $('#hdr-mail').href = mail;
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.innerHTML = sunmoon());

  /* bento */
  $('#bento').innerHTML = `
  <article class="tile t-intro" data-enter data-open="intro">
    ${xp('about details')}
    <span class="chip"><span class="dot pulse"></span>${esc(P.role)}</span>
    <div>
      <h1 class="name">${esc(P.first)}<span class="l2">${esc(P.last)}</span></h1>
      <p class="headline">${esc(P.headline)}</p>
      <p class="intro">${esc(P.intro)}</p>
    </div>
    <div class="ctas">
      <a class="btn btn-p" href="${mail}">Email me ${RIGHT}</a>
      <a class="btn btn-s" href="#writing">Read my writing</a>

      <div style="margin-top:28px"><span class="eyebrow">One agent run, step by step</span><ol class="tl" style="margin-top:12px">${P.agentRun.map((s, i) => `<li class="tl-row${s.fail ? ' fail' : ''}"><span class="y">${String(i + 1).padStart(2, '0')}</span><div><b>${esc(s.step)}</b><span>${esc(s.detail)}</span></div></li>`).join('')}</ol></div>`,
    stack: () => `<span class="eyebrow">Stack</span><h2 class="sh-h" id="sheet-title">${tools.length} tools in daily use</h2>${P.stack.map(g => `<div class="grp"><div><h3>${esc(g.group)}</h3><p>${esc(g.note)}</p></div><div class="tools">${g.tools.map(t => toolChip(t)).join('')}</div></div>`).join('')}`,

<script>
/* ============ interactions that need no animation library ============ */
(function () {
  const root = document.documentElement;
  const RM = root.classList.contains('rm');
  const fine = matchMedia('(hover: hover) and (pointer: fine)').matches;
  const $ = s => document.querySelector(s);

  /* Lenis */
  let lenis = null;
  if (!RM && window.Lenis) {
    lenis = new Lenis({ lerp: 0.1, smoothWheel: true });
    const raf = t => { lenis.raf(t); requestAnimationFrame(raf); };
    requestAnimationFrame(raf);
  }
  window.__lenis = lenis;
  const scrollToEl = (el) => {
    if (lenis) lenis.scrollTo(el, { offset: el.id === 'top' ? -200 : -72, duration: 1.2 });
    else el.scrollIntoView({ behavior: RM ? 'auto' : 'smooth' });
  };
  window.__scrollToEl = scrollToEl;
  document.addEventListener('click', e => {
    const a = e.target.closest('a[href^="#"]');
    if (!a || a.closest('#sheet')) return;
    const el = document.getElementById(a.getAttribute('href').slice(1));
    if (!el) return;
    e.preventDefault(); scrollToEl(el);
  });

  /* theme */
  const setTheme = (t) => { root.dataset.theme = t; try { localStorage.setItem('theme', t); } catch (e) {}
    document.querySelectorAll('[data-theme-toggle]').forEach(b => b.setAttribute('aria-label', t === 'dark' ? 'Switch to light theme' : 'Switch to dark theme')); };
  setTheme(root.dataset.theme);
  document.querySelectorAll('[data-theme-toggle]').forEach(b => b.addEventListener('click', e => {
    const next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    if (!document.startViewTransition || RM) return setTheme(next);
    const r = b.getBoundingClientRect(); const x = r.left + r.width / 2, y = r.top + r.height / 2;
    const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    const vt = document.startViewTransition(() => setTheme(next));
    vt.ready.then(() => root.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
      { duration: 650, easing: 'cubic-bezier(.77,0,.175,1)', pseudoElement: '::view-transition-new(root)' })).catch(() => {});
  }));

  /* header state, nav indicator, top ring */
  const hdr = $('#hdr'), nav = $('#nav'), ind = nav.querySelector('.ind'), links = [...nav.querySelectorAll('a')];
  let active = links[0];
  const moveInd = (a) => {
    const n = nav.getBoundingClientRect(), r = a.getBoundingClientRect();
    const L = r.left - n.left - 4, R = n.right - r.right - 4;
    ind.style.clipPath = `inset(0 ${R}px 0 ${L}px round 999px)`;
    links.forEach(l => l.classList.toggle('hover', l === a));
  };
  links.forEach(a => { a.addEventListener('pointerenter', () => moveInd(a)); a.addEventListener('focus', () => moveInd(a)); });
  nav.addEventListener('pointerleave', () => moveInd(active));
  const secs = links.map(a => document.getElementById(a.dataset.sec));
  const ring = $('#ttop-c'), C = 2 * Math.PI * 22, ttop = $('#ttop');
  ring.style.strokeDasharray = C;
  const onScroll = () => {
    const y = scrollY, max = document.documentElement.scrollHeight - innerHeight;
    hdr.classList.toggle('scrolled', y > 8);
    ttop.classList.toggle('on', y > 700);
    ring.style.strokeDashoffset = C * (1 - Math.min(1, y / Math.max(1, max)));
    let cur = links[0];
    secs.forEach((s, i) => { if (s && s.getBoundingClientRect().top < innerHeight * 0.45) cur = links[i]; });
    if (cur !== active) { active = cur; links.forEach(l => l.setAttribute('aria-current', l === cur ? 'true' : 'false')); if (!nav.matches(':hover')) moveInd(cur); }
  };
  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', () => moveInd(active));
  links[0].setAttribute('aria-current', 'true');
  requestAnimationFrame(() => { ind.style.transition = 'none'; moveInd(active); requestAnimationFrame(() => ind.style.transition = ''); onScroll(); });
  ttop.addEventListener('click', () => scrollToEl(document.getElementById('top')));

  /* cursor spotlight: one listener, CSS vars written in rAF */
  if (fine) {
    let px = 0, py = 0, tile = null, queued = false;
    const write = () => { queued = false; if (!tile) return; const r = tile.getBoundingClientRect(); tile.style.setProperty('--mx', (px - r.left) + 'px'); tile.style.setProperty('--my', (py - r.top) + 'px'); };
    document.addEventListener('pointermove', e => {
      px = e.clientX; py = e.clientY;
      const t = e.target.closest && e.target.closest('.tile');
      if (t !== tile) { tile && tile.classList.remove('lit'); tile = t; tile && tile.classList.add('lit'); }
      if (!queued) { queued = true; requestAnimationFrame(write); }
    }, { passive: true });
    document.addEventListener('pointerleave', () => { tile && tile.classList.remove('lit'); tile = null; });
  }

  /* odometer */
  const roll = (scope, instant) => scope.querySelectorAll('.odo').forEach(o => {
    const strips = [...o.querySelectorAll('.odo-s')];
    strips.forEach((s, i) => {
      const n = +s.dataset.n;
      if (instant || RM) { s.style.transition = 'none'; s.style.transform = `translateY(${-(10 + n)}em)`; return; }
      s.style.transition = 'none'; s.style.transform = 'translateY(0)'; s.offsetHeight;
      s.style.transition = ''; s.style.transitionDelay = (i * 90 + (strips.length - i) * 20) + 'ms';
      s.style.transform = `translateY(${-(10 + n)}em)`;
    });
  });
  window.__roll = roll;
  const stats = document.querySelector('.t-stats');
  let lastRoll = 0;
  setTimeout(() => { roll(stats); lastRoll = performance.now(); }, RM ? 0 : 650);
  if (fine) stats.addEventListener('pointerenter', () => { if (performance.now() - lastRoll > 2600) { lastRoll = performance.now(); roll(stats); } });

  /* now ticker */
  const run = window.PORTFOLIO.agentRun, tick = $('#tick'), segs = [...document.querySelectorAll('#segs .seg')], tn = $('#tick-n'), nowTile = $('.t-now');
  const DUR = 2800; let idx = -1, timer = 0, visible = true, hovering = false;
  const show = (i) => {
    const s = run[i];
    const el = document.createElement('div');
    el.className = 'tick-item pre';
    el.innerHTML = `<div class="tick-step"><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.step}${s.fail ? '<span class="tag">failed</span>' : ''}</div><p class="tick-detail"></p>`;
    el.querySelector('.tick-detail').textContent = s.detail;
    tick.querySelectorAll('.tick-item').forEach(o => { o.classList.add('post'); setTimeout(() => o.remove(), 600); });
    tick.append(el); el.offsetHeight; el.classList.remove('pre');
    tn.textContent = `${String(i + 1).padStart(2, '0')}/${String(run.length).padStart(2, '0')}`;
    segs.forEach((g, j) => { g.classList.toggle('done', j < i); g.classList.remove('cur'); });
    const g = segs[i]; g.style.setProperty('--dur', DUR + 'ms'); g.offsetWidth; g.classList.add('cur');
  };
  const step = () => { idx = (idx + 1) % run.length; show(idx); };
  let left = DUR, started = 0;
  const loop = () => { clearTimeout(timer); started = performance.now(); timer = setTimeout(() => { step(); left = DUR; loop(); }, left); };
  const pause = () => { if (!timer) return; clearTimeout(timer); timer = 0; left = Math.max(200, left - (performance.now() - started)); nowTile.classList.add('paused'); };
  const resume = () => { if (timer || hovering || !visible || document.hidden) return; nowTile.classList.remove('paused'); loop(); };
  step(); timer = 1; loop();
  if (fine) { nowTile.addEventListener('pointerenter', () => { hovering = true; pause(); }); nowTile.addEventListener('pointerleave', () => { hovering = false; resume(); }); }
  document.addEventListener('visibilitychange', () => document.hidden ? pause() : resume());
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; visible ? resume() : pause(); }).observe(nowTile);

  /* marquee: velocity eased towards a hover target */
  if (!RM) {
    const tracks = [...document.querySelectorAll('.mq-track')], mq = $('#mq'), stackTile = $('.t-stack');
    const st = tracks.map(t => ({ t, x: 0, dir: +t.dataset.dir }));
    let speed = 1, target = 1, last = performance.now(), onScreen = true, raf = 0;
    if (fine) { stackTile.addEventListener('pointerenter', () => target = 0.18); stackTile.addEventListener('pointerleave', () => target = 1); }
    const frame = (now) => {
      const dt = Math.min(64, now - last) / 1000; last = now;
      speed += (target - speed) * Math.min(1, dt * 4);
      st.forEach(s => {
        const w = s.t.scrollWidth / 3;
        s.x += s.dir * 30 * speed * dt;
        if (s.x <= -w) s.x += w; if (s.x > 0) s.x -= w;
        s.t.style.transform = `translate3d(${s.x}px,0,0)`;
      });
      raf = onScreen && !document.hidden ? requestAnimationFrame(frame) : 0;
    };
    st.forEach(s => { if (s.dir > 0) s.x = -s.t.scrollWidth / 3; });
    const start = () => { if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } };
    new IntersectionObserver(([e]) => { onScreen = e.isIntersecting; onScreen && start(); }).observe(stackTile);
    document.addEventListener('visibilitychange', () => !document.hidden && onScreen && start());
    start();
  }

  /* carousel: mouse drag with momentum, then snap */
  const car = $('#car'), bar = $('#car-bar'), prev = $('#car-prev'), next = $('#car-next');
  const cards = () => [...car.children];
  const snapX = () => { const pad = parseFloat(getComputedStyle(car).scrollPaddingLeft) || 0; return cards().map(c => c.offsetLeft - pad); };
  const nearest = (x) => snapX().reduce((a, b) => Math.abs(b - x) < Math.abs(a - x) ? b : a, 0);
  const updBar = () => {
    const max = car.scrollWidth - car.clientWidth; const p = max > 0 ? car.scrollLeft / max : 0;
    bar.style.transform = `scaleX(${Math.max(.04, p)})`;
    prev.disabled = car.scrollLeft < 4; next.disabled = car.scrollLeft > max - 4;
  };
  car.addEventListener('scroll', updBar, { passive: true }); addEventListener('resize', updBar); updBar();
  const stepBy = d => { const xs = snapX(); const cur = xs.findIndex(x => x >= car.scrollLeft - 4); const i = Math.max(0, Math.min(xs.length - 1, (cur < 0 ? xs.length - 1 : cur) + d)); car.scrollTo({ left: xs[i], behavior: RM ? 'auto' : 'smooth' }); };
  prev.addEventListener('click', () => stepBy(-1)); next.addEventListener('click', () => stepBy(1));
  let down = false, moved = false, sx = 0, sl = 0, lx = 0, lt = 0, v = 0, mom = 0;
  car.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse' || e.button !== 0) return;
    cancelAnimationFrame(mom); down = true; moved = false; sx = lx = e.clientX; sl = car.scrollLeft; lt = performance.now(); v = 0;
  });
  addEventListener('pointermove', e => {
    if (!down) return;
    const dx = e.clientX - sx;
    if (!moved && Math.abs(dx) > 5) { moved = true; car.classList.add('drag'); }
    if (!moved) return;
    const now = performance.now(), dt = Math.max(1, now - lt);
    v = 0.8 * ((e.clientX - lx) / dt) + 0.2 * v; lx = e.clientX; lt = now;
    car.scrollLeft = sl - dx;
  });
  const release = () => {
    if (!down) return; down = false;
    if (!moved) return;
    let vel = -v * 16;
    const settle = () => {
      const x = nearest(car.scrollLeft);
      car.classList.remove('drag');
      car.scrollTo({ left: x, behavior: RM ? 'auto' : 'smooth' });
    };
    if (RM || Math.abs(vel) < 1) return settle();
    const fr = () => { car.scrollLeft += vel; vel *= 0.93; if (Math.abs(vel) > 0.6) mom = requestAnimationFrame(fr); else settle(); };
    mom = requestAnimationFrame(fr);
  };
  addEventListener('pointerup', release); addEventListener('pointercancel', release);
  car.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); moved = false; } }, true);
  car.addEventListener('dragstart', e => e.preventDefault());

  /* copy email */
  const copy = $('#copy');
  copy.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(window.PORTFOLIO.email); } catch (e) { return; }
    copy.classList.add('done'); setTimeout(() => copy.classList.remove('done'), 1600);
  });
})();
</script>

<script type="module">
/* ============ Motion: entrance springs, reveals, FLIP sheet ============ */
const root = document.documentElement;
const RM = root.classList.contains('rm');
let M = null;
try { M = await import('https://cdn.jsdelivr.net/npm/motion@11.11.13/+esm'); window.__motion = true; }
catch (e) { root.classList.add('reveal-all'); }

/* value driver: Motion spring when available, damped spring fallback otherwise */
function drive(from, to, { stiffness = 300, damping = 30, mass = 1 } = {}, onUpdate) {
  if (RM) { onUpdate(to); return Promise.resolve(); }
  if (M) {
    const c = M.animate(from, to, { type: 'spring', stiffness, damping, mass, restDelta: 0.0005, restSpeed: 0.002, onUpdate });
    return c.finished ? c.finished.then(() => onUpdate(to)) : c.then(() => onUpdate(to));
  }
  return new Promise(res => {
    let x = from, v = 0, last = performance.now();
    const f = (now) => {
      const dt = Math.min(0.032, (now - last) / 1000); last = now;
      const a = (-stiffness * (x - to) - damping * v) / mass; v += a * dt; x += v * dt;
      if (Math.abs(x - to) < 0.0005 && Math.abs(v) < 0.002) { onUpdate(to); return res(); }
      onUpdate(x); requestAnimationFrame(f);
    };
    requestAnimationFrame(f);
  });
}

/* entrances */
if (M && !RM) {
  const tiles = [...document.querySelectorAll('#bento [data-enter]')];
  M.animate(tiles, { opacity: [0, 1], y: [28, 0], scale: [0.96, 1] },
    { delay: M.stagger(0.065, { startDelay: 0.05 }), type: 'spring', stiffness: 210, damping: 24, mass: 1 });
  const below = [...document.querySelectorAll('main > section:not(#top) [data-enter]')];
  below.forEach(el => {
    M.inView(el, () => {
      const sibs = el.parentElement.id === 'prin' ? [...el.parentElement.children].indexOf(el) : 0;
      M.animate(el, { opacity: [0, 1], y: [24, 0], scale: [0.98, 1] }, { delay: sibs * 0.07, type: 'spring', stiffness: 200, damping: 26 });
    }, { margin: '0px 0px -12% 0px' });
  });
}

/* ---------- shared-element sheet ---------- */
const sheet = document.getElementById('sheet'), bg = document.getElementById('sheet-bg'), body = document.getElementById('sheet-body'),
  content = document.getElementById('sheet-content'), backdrop = document.getElementById('backdrop'), closeBtn = document.getElementById('sheet-close');
let state = null; // { tile, ghost, t, s, opener }
const clamp = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, p) => a + (b - a) * p;

function frame(p, dir) {
  const { t, s, ghost } = state;
  const x = lerp(t.left - s.left, 0, p), y = lerp(t.top - s.top, 0, p);
  const w = lerp(t.width, s.width, p), h = lerp(t.height, s.height, p);
  const sx = w / s.width, sy = h / s.height;
  const R = lerp(24, 28, clamp(p));
  bg.style.transform = `translate(${x}px, ${y}px) scale(${sx}, ${sy})`;
  bg.style.borderRadius = `${R / sx}px / ${R / sy}px`;
  const cx = s.left + x + w / 2 - (t.left + t.width / 2), cy = s.top + y + h / 2 - (t.top + t.height / 2);
  const gs = Math.min(w / t.width, h / t.height);
  ghost.style.transform = `translate(${cx}px, ${cy}px) scale(${Math.min(gs, 1.25)})`;
  ghost.style.opacity = dir > 0 ? 1 - clamp(p / 0.32) : clamp(1 - p / 0.4);
  const cp = dir > 0 ? clamp((p - 0.3) / 0.55) : clamp((p - 0.55) / 0.45);
  body.style.opacity = cp;
  body.style.transform = `translate(${x}px, ${y + (1 - cp) * 14}px)`;
  backdrop.style.opacity = clamp(p);
}

function open(tile) {
  if (state) return;
  const kind = tile.dataset.open;
  const build = window.__sheets[kind]; if (!build) return;
  content.innerHTML = build();
  backdrop.hidden = false; sheet.hidden = false;
  const s = sheet.getBoundingClientRect(), t = tile.getBoundingClientRect();
  const ghost = tile.cloneNode(true);
  ghost.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
  ghost.removeAttribute('data-enter'); ghost.setAttribute('aria-hidden', 'true'); ghost.inert = true;
  ghost.classList.add('ghost'); ghost.classList.remove('lit');
  Object.assign(ghost.style, { left: t.left + 'px', top: t.top + 'px', width: t.width + 'px', height: t.height + 'px', opacity: 1 });
  document.body.append(ghost);
  tile.style.visibility = 'hidden';
  state = { tile, ghost, t, s, opener: document.activeElement, kind };
  window.__lenis && window.__lenis.stop();
  document.documentElement.style.overflow = 'hidden';
  frame(0, 1);
  if (kind === 'stats') window.__roll && window.__roll(content, true), setTimeout(() => window.__roll(content), 220);
  closeBtn.focus({ preventScroll: true, focusVisible: false });
  state.anim = drive(0, 1, { stiffness: 280, damping: 28 }, p => state && frame(p, 1));
  [...document.querySelectorAll('main, header, footer, #ttop')].forEach(n => n.inert = true);
}

async function close(then) {
  if (!state || state.closing) return;
  state.closing = true;
  // re-measure: tile may have moved if viewport changed
  state.t = state.tile.getBoundingClientRect();
  state.s = sheet.getBoundingClientRect();
  [...document.querySelectorAll('main, header, footer, #ttop')].forEach(n => n.inert = false);
  await drive(1, 0, { stiffness: 380, damping: 36 }, p => frame(p, -1));
  const { tile, ghost, opener } = state;
  tile.style.visibility = ''; ghost.remove();
  sheet.hidden = true; backdrop.hidden = true;
  bg.style.cssText = ''; body.style.cssText = '';
  document.documentElement.style.overflow = '';
  window.__lenis && window.__lenis.start();
  state = null;
  (tile.querySelector('.xp') || opener || tile).focus({ preventScroll: true });
  then && then();
}

document.getElementById('bento').addEventListener('click', e => {
  const tile = e.target.closest('[data-open]'); if (!tile) return;
  const ctl = e.target.closest('a, button');
  if (ctl && !ctl.classList.contains('xp')) return;
  open(tile);
});
closeBtn.addEventListener('click', () => close());
backdrop.addEventListener('click', () => close());
content.addEventListener('click', e => {
  const a = e.target.closest('[data-close]'); if (!a) return;
  e.preventDefault();
  const target = document.querySelector(a.getAttribute('href'));
  close(() => target && window.__scrollToEl(target));
});
addEventListener('keydown', e => {
  if (!state) return;
  if (e.key === 'Escape') { e.preventDefault(); close(); }
  if (e.key === 'Tab') {
    const f = [...sheet.querySelectorAll('a[href], button:not([disabled])')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
});
addEventListener('resize', () => { if (state && !state.closing) { state.s = sheet.getBoundingClientRect(); state.t = state.tile.getBoundingClientRect(); frame(1, 1); } });
</script>
</body>
